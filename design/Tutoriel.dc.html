<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Tutoriel</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;family=Rubik:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;font-family:'Rubik',system-ui,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}a:hover{color:inherit}
.t-light{--bg:#FBF6EC;--surface:#FFFFFF;--ink:#1F1B2D;--muted:#6E6882;--line:#ECE3D2;--line2:#DDD2BD;--sunk:#F3ECDF;--red:#D93A3A;--red-d:#A92A2A;--red-t:#FDE9E6;--gold:#FFC93C;--gold-d:#D9A01A;--gold-t:#FFF3D1;--green:#1FA463;--green-t:#DDF4E7;--blue-t:#E4EEFB;--lilac-t:#EEE8FB;--mint-t:#DFF5EF}
.scr{background:var(--bg);color:var(--ink);font-family:'Rubik',system-ui,sans-serif;position:relative;overflow:hidden;box-sizing:border-box;display:flex;flex-direction:column}
.emoji{font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;line-height:1}
.b{display:flex;align-items:center;justify-content:center;gap:10px;box-sizing:border-box;border-radius:16px;font-weight:800;font-size:16px;letter-spacing:0.05em;text-transform:uppercase;text-decoration:none}
.b-red{background:var(--red);color:#FFFFFF;box-shadow:0 4px 0 var(--red-d)}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:20px;box-sizing:border-box}
.tile{display:flex;align-items:center;justify-content:center;height:44px;border-radius:12px;background:var(--surface);border:2px solid var(--line);box-shadow:0 3px 0 var(--line2);box-sizing:border-box;font-size:22px}
.dim{opacity:0.35}
.hit{border-color:var(--gold);background:var(--gold-t);box-shadow:0 3px 0 var(--gold-d)}
.slot{display:flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:14px;background:var(--surface);border:2px solid var(--ink);box-sizing:border-box;font-size:24px}
.tip{display:flex;align-items:center;gap:12px;font-size:15px;font-weight:600}
.dot{width:8px;height:8px;border-radius:999px;background:var(--line2)}
</style>
</helmet>
<div class="scr t-light" style="width: 375px; height: 667px; padding-top: 20px;">
  <div style="padding: 8px 16px 0; display: flex; justify-content: space-between; align-items: center; height: 44px;">
    <span style="font-size: 13px; font-weight: 700; letter-spacing: 0.1em; color: var(--muted);">COMMENT JOUER</span>
    <a href="Main.dc.html" style="padding: 10px 4px; font-size: 15px; font-weight: 700; color: var(--muted); text-decoration: none;">Passer</a>
  </div>

  <div style="padding: 12px 16px 0;">
    <div class="card" style="padding: 14px; display: flex; flex-direction: column; align-items: center; gap: 12px;">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
        <span style="font-size: 12px; font-weight: 700; color: var(--muted);"><span class="emoji">🎬</span> Film</span>
        <span style="font-size: 22px; font-weight: 800;">Titanic</span>
      </div>
      <div style="width: 100%; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px;">
        <div class="tile dim emoji">🔥</div>
        <div class="tile hit emoji">🚢</div>
        <div class="tile dim emoji">🎸</div>
        <div class="tile dim emoji">👽</div>
        <div class="tile dim emoji">🍕</div>
        <div class="tile dim emoji">🚀</div>
        <div class="tile hit emoji">🧊</div>
        <div class="tile dim emoji">🎲</div>
      </div>
      <div style="display: flex; align-items: center; gap: 10px;">
        <div class="slot emoji">🚢</div>
        <span style="font-size: 20px; font-weight: 800; color: var(--muted);">+</span>
        <div class="slot emoji">🧊</div>
        <span style="font-size: 20px; font-weight: 800; color: var(--muted);">=</span>
        <div class="slot emoji" style="background: var(--green-t); border-color: var(--green);">✨</div>
      </div>
    </div>
  </div>

  <h1 style="margin: 20px 24px 0; font-size: 22px; font-weight: 800; text-align: center; line-height: 1.25;">Trouve les bons emojis, puis fusionne !</h1>

  <div style="padding: 16px 24px 0; display: flex; flex-direction: column; gap: 10px;">
    <div class="tip"><span class="emoji" style="font-size: 20px;">❤️</span>4 vies par palier de 20 niveaux</div>
    <div class="tip"><span class="emoji" style="font-size: 20px;">⏱️</span>Plus tu es rapide, plus tu marques</div>
    <div class="tip"><span class="emoji" style="font-size: 20px;">🔥</span>5 bonnes réponses d'affilée = Fever</div>
  </div>

  <div style="flex-grow: 1;"></div>
  <div style="padding: 0 16px 20px; display: flex; flex-direction: column; align-items: center; gap: 16px;">
    <div style="display: flex; gap: 6px;" aria-label="Étape 1 sur 3"><div class="dot" style="width: 22px; background: var(--ink);"></div><div class="dot"></div><div class="dot"></div></div>
    <a class="b b-red" href="Main.dc.html" style="width: 100%; height: 56px;">C'est parti</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":375,"height":667}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
