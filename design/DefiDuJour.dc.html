<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Défi du jour</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;family=Rubik:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;font-family:'Rubik',system-ui,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}a:hover{color:inherit}
.t-light{--bg:#FBF6EC;--surface:#FFFFFF;--ink:#1F1B2D;--muted:#6E6882;--line:#ECE3D2;--line2:#DDD2BD;--sunk:#F3ECDF;--red:#D93A3A;--red-d:#A92A2A;--red-t:#FDE9E6;--gold:#FFC93C;--gold-d:#D9A01A;--gold-t:#FFF3D1;--green:#1FA463;--green-t:#DDF4E7;--blue-t:#E4EEFB;--lilac-t:#EEE8FB;--mint-t:#DFF5EF}
.scr{background:var(--bg);color:var(--ink);font-family:'Rubik',system-ui,sans-serif;position:relative;overflow:hidden;box-sizing:border-box;display:flex;flex-direction:column}
.emoji{font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;line-height:1}
.b{display:flex;align-items:center;justify-content:center;gap:10px;box-sizing:border-box;border-radius:16px;font-weight:800;font-size:16px;letter-spacing:0.05em;text-transform:uppercase;text-decoration:none}
.b-red{background:var(--red);color:#FFFFFF;box-shadow:0 4px 0 var(--red-d)}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:20px;box-sizing:border-box}
.ib{display:flex;align-items:center;justify-content:center;flex-shrink:0;width:44px;height:44px;border-radius:14px;background:var(--surface);border:1.5px solid var(--line);color:var(--ink);box-sizing:border-box;text-decoration:none}
.day{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1}
.dl{font-size:12px;font-weight:700;color:var(--muted)}
.dc{display:flex;align-items:center;justify-content:center;width:36px;height:36px;box-sizing:border-box;border-radius:12px;font-size:16px}
.done{background:var(--green);color:#FFFFFF}
.todo{border:2px dashed var(--line2)}
.rule{display:flex;align-items:center;gap:12px;white-space:normal;font-size:15px;font-weight:600;line-height:1.3}
</style>
</helmet>
<div class="scr t-light" style="width: 375px; height: 667px; padding-top: 20px;">
  <div style="padding: 8px 16px 0; display: flex; align-items: center; gap: 12px;">
    <a class="ib" href="Main.dc.html" aria-label="Retour"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <h1 style="margin: 0; font-size: 20px; font-weight: 800;">Défi du jour</h1>
  </div>

  <div style="padding: 16px 16px 0;">
    <div class="card" style="padding: 16px; display: flex; align-items: center; gap: 16px; background: var(--red-t); border-color: var(--red-t);">
      <div style="width: 72px; height: 72px; border-radius: 18px; background: var(--surface); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; flex-shrink: 0;">
        <span style="font-size: 11px; font-weight: 800; color: var(--red);">JEUDI</span>
        <span style="font-size: 28px; font-weight: 800; line-height: 1;">25</span>
        <span style="font-size: 11px; font-weight: 700; color: var(--muted);">sept.</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <span style="font-size: 17px; font-weight: 800;">10 niveaux mystère</span>
        <span style="font-size: 14px; font-weight: 600; color: var(--muted);">Les mêmes pour tout le monde. Nouveau défi dans 9 h 14.</span>
      </div>
    </div>
  </div>

  <div style="padding: 12px 16px 0;">
    <div class="card" style="padding: 14px 10px;">
      <div style="display: flex; justify-content: space-between; padding: 0 6px 12px;">
        <span style="font-size: 15px; font-weight: 800;"><span class="emoji">🔥</span> Série : 4 jours</span>
        <span style="font-size: 13px; font-weight: 600; color: var(--muted);">Record : 12</span>
      </div>
      <div style="display: flex;">
        <div class="day"><span class="dl">L</span><span class="dc done"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-label="fait"><path d="M5 12l5 5 9-10"></path></svg></span></div>
        <div class="day"><span class="dl">M</span><span class="dc done"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-label="fait"><path d="M5 12l5 5 9-10"></path></svg></span></div>
        <div class="day"><span class="dl">M</span><span class="dc done"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-label="fait"><path d="M5 12l5 5 9-10"></path></svg></span></div>
        <div class="day"><span class="dl" style="color: var(--red);">J</span><span class="dc" style="border: 2px solid var(--red); font-weight: 800; color: var(--red);">?</span></div>
        <div class="day"><span class="dl">V</span><span class="dc todo"></span></div>
        <div class="day"><span class="dl">S</span><span class="dc todo"></span></div>
        <div class="day"><span class="dl">D</span><span class="dc todo emoji">🎁</span></div>
      </div>
    </div>
  </div>

  <div style="padding: 18px 20px 0; display: flex; flex-direction: column; gap: 12px;">
    <div class="rule"><span class="emoji" style="font-size: 20px;">🏅</span><span>+50 <span class="emoji">💰</span> et +2 <span class="emoji">💡</span> si tu termines</span></div>
    <div class="rule"><span class="emoji" style="font-size: 20px;">🎁</span><span>7 jours de suite : coffre surprise</span></div>
    <div class="rule"><span class="emoji" style="font-size: 20px;">🌍</span><span>Compare ton score avec le monde entier</span></div>
  </div>

  <div style="flex-grow: 1;"></div>
  <div style="padding: 0 16px 20px;">
    <a class="b b-red" href="Jeu.dc.html" style="height: 56px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="#FFFFFF" aria-hidden="true"><path d="M7 4l13 8-13 8z"></path></svg>Jouer le défi</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":375,"height":667}}'>

  renderVals() { return {}; }
}
</script>
</body>
</html>
