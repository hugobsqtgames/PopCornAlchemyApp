body{margin:0;font-family:'Rubik',system-ui,sans-serif}

.t-light{--bg:#FBF6EC;--surface:#FFFFFF;--ink:#1F1B2D;--muted:#6E6882;--line:#ECE3D2;--line2:#DDD2BD;--sunk:#F3ECDF;--red:#D93A3A;--red-d:#A92A2A;--red-t:#FDE9E6;--gold:#FFC93C;--gold-d:#D9A01A;--gold-t:#FFF3D1;--green:#1FA463;--green-t:#DDF4E7;--blue-t:#E4EEFB;--lilac-t:#EEE8FB;--mint-t:#DFF5EF}
.scr{background:var(--bg);color:var(--ink);font-family:'Rubik',system-ui,sans-serif;position:relative;overflow:hidden;box-sizing:border-box;display:flex;flex-direction:column}
.emoji{font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;line-height:1}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:20px;box-sizing:border-box}
.pill{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:999px;background:var(--surface);border:1.5px solid var(--line);font-weight:700;font-size:14px;box-sizing:border-box}
.seg{display:flex;align-items:center;justify-content:center;flex:1;height:32px;border-radius:10px;font-size:13px;font-weight:600;color:var(--muted);text-decoration:none}
.seg-on{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(31,27,45,0.15)}
.pack{display:flex;flex-direction:column;align-items:center;gap:5px;height:124px;padding:12px 10px 10px;border-radius:20px;background:var(--surface);border:1.5px solid var(--line);box-sizing:border-box;position:relative}
.price{display:flex;align-items:center;justify-content:center;width:100%;height:32px;margin-top:auto;border-radius:10px;background:var(--red);color:#FFFFFF;font-size:15px;font-weight:800}
.flag{position:absolute;top:-10px;left:50%;transform:translateX(-50%);white-space:nowrap;padding:2px 8px;border-radius:999px;font-size:10px;font-weight:800;letter-spacing:0.05em}
.tabbar{display:flex;box-sizing:border-box;background:var(--surface);border-top:1.5px solid var(--line);flex-shrink:0}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:50px;font-size:10px;font-weight:600;color:var(--muted);text-decoration:none}
.on{color:var(--red)}
</style>
