<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;family=Rubik:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;font-family:'Rubik',system-ui,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}a:hover{color:inherit}
.t-light{--bg:#FBF6EC;--surface:#FFFFFF;--ink:#1F1B2D;--muted:#6E6882;--line:#ECE3D2;--line2:#DDD2BD;--sunk:#F3ECDF;--red:#D93A3A;--red-d:#A92A2A;--red-t:#FDE9E6;--gold:#FFC93C;--gold-d:#D9A01A;--gold-t:#FFF3D1;--green:#1FA463;--green-t:#DDF4E7;--blue-t:#E4EEFB;--lilac-t:#EEE8FB;--mint-t:#DFF5EF}
.scr{background:var(--bg);color:var(--ink);font-family:'Rubik',system-ui,sans-serif;position:relative;overflow:hidden;box-sizing:border-box;display:flex;flex-direction:column}
.px{font-family:'Press Start 2P',monospace;line-height:1.25}
.emoji{font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;line-height:1}
.b{display:flex;align-items:center;justify-content:center;gap:10px;box-sizing:border-box;border-radius:16px;font-weight:800;font-size:16px;letter-spacing:0.05em;text-transform:uppercase;text-decoration:none}
.b-red{background:var(--red);color:#FFFFFF;box-shadow:0 4px 0 var(--red-d)}
.badge{display:flex;align-items:center;justify-content:center;flex-shrink:0;border-radius:12px}
.lang{display:flex;align-items:center;gap:14px;width:100%;height:60px;padding:0 16px;box-sizing:border-box;border-radius:18px;background:var(--surface);border:2px solid var(--line);text-align:left}
.radio{width:24px;height:24px;box-sizing:border-box;border-radius:999px;border:2px solid var(--line2);display:flex;align-items:center;justify-content:center}
</style>
</helmet>
<div class="scr t-light" style="width: 375px; height: 667px; padding-top: 20px;">
  <div style="flex-grow: 1;"></div>
  <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
    <div class="badge emoji" style="width: 80px; height: 80px; border-radius: 22px; background: var(--gold); box-shadow: 0 5px 0 var(--gold-d); font-size: 44px; margin-bottom: 14px;">🍿</div>
    <div class="px" style="font-size: 18px;"><span style="color: var(--red);">POP</span>-CORN</div>
    <div class="px" style="font-size: 18px;">ALCHEMY</div>
  </div>
  <div style="flex-grow: 1;"></div>
  <div style="padding: 0 16px; display: flex; flex-direction: column; gap: 10px;">
    <h1 style="margin: 0; font-size: 22px; font-weight: 800; text-align: center;">Choisis ta langue</h1>
    <p style="margin: 0 0 8px; font-size: 14px; font-weight: 600; color: var(--muted); text-align: center;">Choose your language · Elige tu idioma</p>
    <div role="radiogroup" aria-label="Langue" style="display: flex; flex-direction: column; gap: 10px;">
      <button class="lang" role="radio" aria-checked="true" style="border-color: var(--red); background: var(--red-t);">
        <span class="emoji" style="font-size: 28px;">🇫🇷</span><span style="flex: 1; font-size: 17px; font-weight: 700;">Français</span>
        <span class="radio" style="border-color: var(--red); background: var(--red);"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span>
      </button>
      <button class="lang" role="radio" aria-checked="false"><span class="emoji" style="font-size: 28px;">🇬🇧</span><span style="flex: 1; font-size: 17px; font-weight: 700;">English</span><span class="radio"></span></button>
      <button class="lang" role="radio" aria-checked="false"><span class="emoji" style="font-size: 28px;">🇪🇸</span><span style="flex: 1; font-size: 17px; font-weight: 700;">Español</span><span class="radio"></span></button>
    </div>
  </div>
  <div style="flex-grow: 1;"></div>
  <div style="padding: 0 16px 20px;">
    <a class="b b-red" href="Tutoriel.dc.html" style="height: 56px;">Continuer</a>
  </div>
</div>
