<style>
body{margin:0;font-family:'Rubik',system-ui,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}

.t-light{--bg:#FBF6EC;--surface:#FFFFFF;--ink:#1F1B2D;--muted:#6E6882;--line:#ECE3D2;--line2:#DDD2BD;--sunk:#F3ECDF;--red:#D93A3A;--red-d:#A92A2A;--red-t:#FDE9E6;--gold:#FFC93C;--gold-d:#D9A01A;--gold-t:#FFF3D1;--green:#1FA463;--green-t:#DDF4E7;--blue-t:#E4EEFB;--lilac-t:#EEE8FB;--mint-t:#DFF5EF}

.px{font-family:'Press Start 2P',monospace;line-height:1.25}
.emoji{font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;line-height:1}
.b{display:flex;align-items:center;justify-content:center;gap:10px;box-sizing:border-box;border-radius:16px;font-weight:800;font-size:16px;letter-spacing:0.05em;text-transform:uppercase;text-decoration:none}
.b-red{background:var(--red);color:#FFFFFF;box-shadow:0 4px 0 var(--red-d)}
.b-gold{background:var(--gold);color:#1F1B2D;box-shadow:0 4px 0 var(--gold-d)}
.b-soft{background:var(--surface);color:var(--ink);border:2px solid var(--line2);box-shadow:0 3px 0 var(--line2)}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:20px;box-sizing:border-box}

    <span class="emoji" style="font-size: 52px;">💔</span>
    <span class="px" style="font-size: 22px; color: var(--red);">GAME OVER</span>
    <span style="font-size: 15px; font-weight: 500; color: var(--muted);">Ton alchimie a échoué au niveau 34</span>
  </div>

      <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px;"><span style="font-size: 12px; font-weight: 700; letter-spacing: 0.1em; color: var(--muted);">RECORD</span><span style="font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums;">45 200</span></div>
    </div>
    <p style="margin: 8px 0 0; text-align: center; font-size: 12px; font-weight: 500; color: var(--muted);">Score envoyé au classement Game Center</p>
  </div>

  <div style="padding: 18px 16px 0;">
    <div style="padding: 14px; border-radius: 20px; background: var(--gold-t); display: flex; flex-direction: column; gap: 12px;">
      <span style="font-size: 15px; font-weight: 800; text-align: center;">Continuer avec 1 vie ?</span>

  <div style="flex: 1;"></div>
  <div style="padding: 0 16px 20px; display: flex; gap: 10px;">
    <a class="b b-soft" href="Main.dc.html" style="flex: 1; height: 52px; font-size: 14px;">Accueil</a>
    <a class="b b-red" href="Categories.dc.html" style="flex: 1; height: 52px; font-size: 14px;">Rejouer</a>
  </div>
</div>
